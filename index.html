<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم | Dashboard</title>
  <!-- خط Tajawal من Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- مكتبة الأيقونات FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="dashboard-container">
    <!-- الشريط الجانبي Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="logo">
        <i class="fa-solid fa-chart-pie"></i>
        <h2>لوحتي</h2>
      </div>
      <nav class="menu">
        <a href="#" class="active"><i class="fa-solid fa-house"></i> الرئيسية</a>
        <a href="#"><i class="fa-solid fa-users"></i> المستخدمين</a>
        <a href="#"><i class="fa-solid fa-cart-shopping"></i> الطلبات</a>
        <a href="#"><i class="fa-solid fa-gear"></i> الإعدادات</a>
      </nav>
    </aside>

    <!-- المحتوى الرئيسي Main Content -->
    <main class="main-content">
      <!-- الهيدر العلوي Header -->
      <header class="top-header">
        <div class="header-right">
          <!-- زرار القائمة للشاشات الصغيرة -->
          <button id="menuToggle" class="menu-btn" aria-label="فتح القائمة">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div class="logo-mobile">
            <i class="fa-solid fa-chart-pie"></i>
            <h2>لوحتي</h2>
          </div>
        </div>

        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="searchInput" placeholder="ابحث عن مستخدم...">
        </div>

        <button id="themeToggle" class="theme-btn" aria-label="تبديل الوضع">
          <i class="fa-solid fa-moon"></i>
        </button>
      </header>

      <!-- كروت الإحصائيات Stats Cards -->
      <section class="stats-grid">
        <div class="card">
          <div class="card-info">
            <span>إجمالي المبيعات</span>
            <h3>$24,500</h3>
          </div>
          <i class="fa-solid fa-dollar-sign card-icon"></i>
        </div>
        <div class="card">
          <div class="card-info">
            <span>الطلبات الجديدة</span>
            <h3>1,250</h3>
          </div>
          <i class="fa-solid fa-bag-shopping card-icon"></i>
        </div>
        <div class="card">
          <div class="card-info">
            <span>المستخدمين النشطين</span>
            <h3>850</h3>
          </div>
          <i class="fa-solid fa-user-check card-icon"></i>
        </div>
      </section>

      <!-- قسم الرسم البياني والجدول -->
      <section class="content-grid">
        <!-- الرسم البياني -->
        <div class="panel chart-panel">
          <h3>أداء المبيعات</h3>
          <canvas id="salesChart"></canvas>
        </div>

        <!-- جدول البيانات -->
        <div class="panel table-panel">
          <h3>آخر العملاء</h3>
          <table>
            <thead>
              <tr>
                <th>الاسم</th>
                <th>البريد الإلكتروني</th>
                <th>الحالة</th>
              </tr>
            </thead>
            <tbody id="userTableBody">
              <!-- سيتم ملء البيانات ديناميكياً بواسطة JavaScript -->
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- مكتبة Chart.js للرسم البياني -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="main.js"></script>
</body>
</html>
